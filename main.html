<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Fim está próximo...</title>
    <style>

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;

        }

            .video-fundo {
  position: fixed;
  top: 0;
  left: 0;
  min-width: 100vw;
  min-height: 100vh;
  object-fit: cover;
  z-index: -1; /* pra ficar no fundo */
    }

        .timer-container {
  display: flex;
  gap: 15px;
  text-align: center;
  font-family: Arial, sans-serif;
}
.time-box {
  background: #7c7c7c;
  padding: 10px 15px;
  border-radius: 8px;
  min-width: 60px;
}
.time-box span {
  display: block;
  font-size: 24px;
  font-weight: bold;
}
    </style>





</head>
<body>
    <script src="script.js"></script>

    <video autoplay muted loop class="video-fundo">
  <source src="gatorodrigo.mov" type="video/mp4">
</video>

    <div id="countdown" class="timer-container">
  <div class="time-box">
    <span id="days">00</span>
    <small>Dias</small>
  </div>
  <div class="time-box">
    <span id="hours">00</span>
    <small>Horas</small>
  </div>
  <div class="time-box">
    <span id="minutes">00</span>
    <small>Minutos</small>
  </div>
  <div class="time-box">
    <span id="seconds">00</span>
    <small>Segundos</small>
  </div>
</div>


</body>
</html>
